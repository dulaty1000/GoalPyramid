name: GoalPyramid
options:
  bundleIdPrefix: kz.dulatabilkhan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  GoalPyramid:
    type: application
    platform: macOS
    sources:
      - path: Sources/GoalPyramid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.dulatabilkhan.GoalPyramid
        PRODUCT_NAME: GoalPyramid
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
schemes:
  GoalPyramid:
    build:
      targets:
        GoalPyramid: all
    run:
      config: Debug
    archive:
      config: Release
